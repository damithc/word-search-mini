<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Word Search</title>
  <meta name="description" content="A simple word search for young children.">
  <meta name="theme-color" content="#f3f0e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Word Search">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="images/icon-180.png">
  <link rel="icon" href="images/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="game">
    <div id="target">
      <div id="word-picture"><img id="word-img" alt=""></div>
      <div id="word-letters" role="heading" aria-level="1"></div>
    </div>
    <div id="grid"></div>
  </main>

  <div id="reward" hidden>
    <img id="reward-img" alt="">
    <div id="reward-track"><div id="reward-bar"></div></div>
  </div>

  <!-- Press and hold to open the grown-up screen; the ring fills while holding -->
  <button id="settings" aria-label="Settings (press and hold)">
    <svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21"/></svg>
    <svg class="gear" viewBox="0 0 24 24" aria-hidden="true">
      <g fill="currentColor"><circle cx="12" cy="12" r="6.6"/><rect x="10.4" y="1.2" width="3.2" height="5" rx="1" transform="rotate(0 12 12)"/><rect x="10.4" y="1.2" width="3.2" height="5" rx="1" transform="rotate(45 12 12)"/><rect x="10.4" y="1.2" width="3.2" height="5" rx="1" transform="rotate(90 12 12)"/><rect x="10.4" y="1.2" width="3.2" height="5" rx="1" transform="rotate(135 12 12)"/><rect x="10.4" y="1.2" width="3.2" height="5" rx="1" transform="rotate(180 12 12)"/><rect x="10.4" y="1.2" width="3.2" height="5" rx="1" transform="rotate(225 12 12)"/><rect x="10.4" y="1.2" width="3.2" height="5" rx="1" transform="rotate(270 12 12)"/><rect x="10.4" y="1.2" width="3.2" height="5" rx="1" transform="rotate(315 12 12)"/></g>
      <circle cx="12" cy="12" r="2.8" fill="var(--bg)"/>
    </svg>
  </button>

  <div id="setup" hidden>
    <header>
      <div>
        <p id="app-name">Word Search Mini <span id="app-version"></span></p>
        <h1>Voice recordings</h1>
      </div>
      <button id="setup-done">Done</button>
    </header>
    <p>Record each phrase in your own voice. Recordings stay on this device only.
      Anything not recorded is said by the device's built-in voice.</p>
    <p id="setup-message" hidden></p>
    <div id="setup-list"></div>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
